<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gradWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78350F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <pattern id="grain" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q3 1, 6 3" stroke="#000000" stroke-opacity="0.08" fill="none" stroke-width="0.5"/>
    </pattern>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#gradWood)"/>
  <circle cx="32" cy="32" r="30" fill="url(#grain)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#gradAmber)" stroke-width="2"/>
  <!-- Tablón de madera -->
  <rect x="14" y="18" width="36" height="22" rx="2" fill="url(#gradAmber)"/>
  <rect x="14" y="18" width="36" height="22" rx="2" fill="url(#grain)"/>
  <!-- Vetas -->
  <path d="M14 24 Q22 22, 30 25 T 50 23" stroke="#7C2D12" stroke-opacity="0.4" stroke-width="0.6" fill="none"/>
  <path d="M14 30 Q22 28, 30 31 T 50 29" stroke="#7C2D12" stroke-opacity="0.4" stroke-width="0.6" fill="none"/>
  <path d="M14 36 Q22 34, 30 37 T 50 35" stroke="#7C2D12" stroke-opacity="0.4" stroke-width="0.6" fill="none"/>
  <!-- Clavos -->
  <circle cx="18" cy="21" r="1.2" fill="#451A03"/>
  <circle cx="46" cy="21" r="1.2" fill="#451A03"/>
  <circle cx="18" cy="37" r="1.2" fill="#451A03"/>
  <circle cx="46" cy="37" r="1.2" fill="#451A03"/>
  <!-- Herramienta: escuadra -->
  <g transform="translate(40, 42) rotate(45)">
    <path d="M0 0 L8 0 L8 -8 L6 -8 L6 -2 L0 -2 Z" fill="#FEF3C7" opacity="0.95"/>
  </g>
</svg>